<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoLab | Catálogo Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070b14;
            --bg-secondary: #0d1627;
            --primary-blue: #0066ff;
            --glow-blue: #00d4ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass-bg: rgba(13, 22, 39, 0.6);
            --glass-border: rgba(0, 212, 255, 0.15);
            --card-hover: rgba(0, 102, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 102, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- HEADER & HERO --- */
        header {
            padding: 40px 5% 20px;
            text-align: center;
        }

        .subtitle {
            color: var(--glow-blue);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: inline-block;
            border-bottom: 1px solid var(--primary-blue);
            padding-bottom: 5px;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        /* --- FILTROS DE MARCAS --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 15px;
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover {
            border-color: var(--primary-blue);
            color: #fff;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.4);
        }

        /* --- GRID DEL CATÁLOGO --- */
        .catalog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .moto-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .moto-card:hover {
            transform: translateY(-10px);
            border-color: var(--glow-blue);
            box-shadow: 0 15px 30px var(--card-hover);
        }

        .img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            opacity: 0.85;
        }

        .moto-card:hover .img-container img {
            transform: scale(1.08);
            opacity: 1;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .moto-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
        }

        .moto-price {
            color: var(--glow-blue);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .specs-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spec-item span {
            display: block;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .spec-item strong {
            color: #fff;
        }

        .btn-view {
            width: 100%;
            padding: 12px;
            background: rgba(0, 102, 255, 0.1);
            border: 1px solid var(--primary-blue);
            color: var(--glow-blue);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .moto-card:hover .btn-view {
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            border-color: transparent;
        }

        /* --- MODAL (DETALLE DE LA MOTO) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .modal-content {
                flex-direction: row;
            }
        }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s;
        }

        .btn-close:hover {
            background: var(--primary-blue);
        }

        .modal-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .modal-img {
                width: 50%;
                height: auto;
                min-height: 400px;
            }
        }

        .modal-info {
            padding: 40px 30px;
            flex: 1;
        }

        .modal-info h2 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .modal-info .price {
            font-size: 24px;
            color: var(--glow-blue);
            font-weight: 800;
            margin-bottom: 25px;
        }

        .specs-grid-full {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .desc-text {
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 30px;
            padding-left: 15px;
            border-left: 3px solid var(--primary-blue);
        }

        .btn-ws {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 25px var(--card-hover);
            transition: transform 0.2s;
        }

        .btn-ws:active {
            transform: scale(0.98);
        }

    </style>
</head>
