<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoLab | Catálogo Futurista</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070b14;
            --bg-secondary: #0d1627;
            --primary-blue: #0066ff;
            --glow-blue: #00d4ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass-bg: rgba(13, 22, 39, 0.75);
            --glass-border: rgba(0, 212, 255, 0.2);
            --card-hover: rgba(0, 102, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 255, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .subtitle {
            color: var(--glow-blue);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: inline-block;
            border-bottom: 1px solid var(--primary-blue);
            padding-bottom: 4px;
        }

        h1 {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #fff, var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .filter-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary-blue);
            color: #fff;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(0, 102, 255, 0.4);
        }

        .catalog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 25px;
        }

        .moto-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .moto-card:hover {
            transform: translateY(-8px);
            border-color: var(--glow-blue);
            box-shadow: 0 12px 25px var(--card-hover);
        }

        .img-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            opacity: 0.9;
        }

        .moto-card:hover .img-container img {
            transform: scale(1.06);
            opacity: 1;
        }

        .card-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        .moto-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
            color: #fff;
        }

        .moto-price {
            color: var(--glow-blue);
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .specs-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .spec-item span {
            display: block;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .spec-item strong {
            color: #fff;
            font-size: 11px;
        }

        .btn-view {
            width: 100%;
            padding: 12px;
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid var(--primary-blue);
            color: var(--glow-blue);
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            font-size: 13px;
        }

        .moto-card:hover .btn-view {
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            border-color: transparent;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 11, 20, 0.88);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .modal-content {
                flex-direction: row;
            }
        }

        .btn-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }

        .btn-close:hover {
            background: var(--primary-blue);
        }

        .modal-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        @media (min-width: 768px) {
            .modal-img {
                width: 48%;
                height: auto;
            }
        }

        .modal-info {
            padding: 30px 25px;
            flex: 1;
        }

        .modal-info h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
        }

        .modal-info .price {
            font-size: 22px;
            color: var(--glow-blue);
            font-weight: 800;
            margin-bottom: 20px;
        }

        .specs-grid-full {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .desc-text {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 13px;
            margin-bottom: 25px;
            padding-left: 12px;
            border-left: 3px solid var(--primary-blue);
        }

        .btn-ws {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--primary-blue), var(--glow-blue));
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 20px var(--card-hover);
        }
    </style>
</head>
<body>

    <header>
        <span class="subtitle">Digital Performance</span>
        <h1>Catálogo Inteligente</h1>
        <p class="hero-desc">Explora el rendimiento, diseño y especificaciones técnicas de las mejores máquinas del mercado. Selecciona una marca para comenzar.</p>
        
        <div class="filters">
            <button class="filter-btn active" onclick="filterBrand('all', this)">Todas</button>
            <button class="filter-btn" onclick="filterBrand('Yamaha', this)">Yamaha</button>
            <button class="filter-btn" onclick="filterBrand('Honda', this)">Honda</button>
            <button class="filter-btn" onclick="filterBrand('AKT', this)">AKT</button>
            <button class="filter-btn" onclick="filterBrand('Auteco', this)">Auteco</button>
        </div>
    </header>

    <main class="catalog-container" id="catalogGrid"></main>

    <div class="modal-overlay" id="motoModal">

                <div class="specs-grid-full">
                    <div class="spec-item">
                        <span>Cilindrada</span>
                        <strong id="mCc">-</strong>
                    </div>
                    <div class="spec-item">
                        <span>Potencia</span>
                        <strong id="mHp">-</strong>
                    </div>
                    <div class="spec-item">
                        <span>Torque</span>
                        <strong id="mTorque">-</strong>
                    </div>
                    <div class="spec-item">
                        <span>Peso</span>
                        <strong id="mWeight">-</strong>
                    </div>
                </div>

                <p class="desc-text" id="mDesc">Descripción...</p>

                <a href="#" id="mWsBtn" target="_blank" class="btn-ws">Solicitar Cotización 📲</a>
            </div>
        </div>
    </div>

        const grid = document.getElementById('catalogGrid');

        function renderCatalog(filter) {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? motosData : motosData.filter(m => m.brand === filter);

            filtered.forEach(moto => {
                const card = document.createElement('div');
                card.className = 'moto-card';
                card.setAttribute('onclick', `openModal(${moto.id})`);
                
                card.innerHTML = `
                    <div class="img-container">
                        <img src="${moto.img}" alt="${moto.title}">
                    </div>
                    <div class="card-content">
                        <div class="moto-title">${moto.title}</div>
                        <div class="moto-price">${moto.price}</div>
                        <div class="specs-mini">
                            <div class="spec-item">
                                <span>Cilindrada</span>
                                <strong>${moto.cc}</strong>
                            </div>
                            <div class="spec-item">
                                <span>Potencia</span>
                                <strong>${moto.hp}</strong>
                            </div>
                        </div>
                        <div class="btn-view">Ver Detalle</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBrand(brand, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCatalog(brand);
        }
