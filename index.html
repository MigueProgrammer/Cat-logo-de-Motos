<meta charset="UTF-8">

<title>MOTOX | Catálogo de Motos</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080808;
  color:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#0d0d0d;
  border-bottom:1px solid #222;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#e50914;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:22px;
  font-size:14px;
}

.hero{
  min-height:390px;
  padding:90px 7%;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 75% 40%,#3b0000 0%,transparent 35%),
    linear-gradient(135deg,#111,#050505);
}

.hero h1{
  font-size:clamp(42px,7vw,82px);
  line-height:.95;
  max-width:700px;
}

.hero h1 span{
  color:#e50914;
}

.hero p{
  margin-top:22px;
  color:#aaa;
  max-width:600px;
  font-size:17px;
}

.controles{
  padding:30px 7% 10px;
}

#buscador{
  width:100%;
  padding:15px 18px;
  border-radius:10px;
  border:1px solid #333;
  background:#111;
  color:#fff;
  outline:none;
  margin-bottom:18px;
  font-size:15px;
}

.filtros{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.filtro{
  border:1px solid #333;
  background:#111;
  color:#fff;
  padding:10px 17px;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}

.filtro:hover,
.filtro.activo{
  background:#e50914;
  border-color:#e50914;
}

.catalogo{
  padding:25px 7% 70px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:22px;
}

.card{
  background:#111;
  border:1px solid #242424;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#e50914;
  box-shadow:0 10px 35px rgba(229,9,20,.15);
}

.imagen-box{
  height:220px;
  background:#181818;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.imagen-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.imagen-fallback{
  display:none;
  text-align:center;
  color:#777;
  padding:20px;
}

.card-info{
  padding:18px;
}

.marca{
  color:#e50914;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:1px;
}

.card h3{
  margin:7px 0 14px;
  font-size:21px;
}

.specs{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:13px;
}

.detalle{
  display:none;
  padding:50px 7% 80px;
}

.btn-volver{
  border:1px solid #333;
  background:#111;
  color:#fff;
  padding:11px 18px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:30px;
}

.btn-volver:hover{
  background:#e50914;
  border-color:#e50914;
}

.detalle-grid{
  display:grid;
  grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);
  gap:45px;
  align-items:center;
}

.detalle-imagen{
  background:#111;
  border:1px solid #252525;
  border-radius:18px;
  overflow:hidden;
  min-height:380px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.detalle-imagen img{
  width:100%;
  height:100%;
  max-height:550px;
  object-fit:cover;
}

.detalle h2{
  font-size:48px;
  margin:10px 0 15px;
}

.detalle .marca{
  font-size:14px;
}

.descripcion{
  color:#aaa;
  line-height:1.7;
  margin:20px 0;
}

.ficha{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.ficha div{
  background:#111;
  border:1px solid #242424;
  padding:15px;
  border-radius:10px;
}

.ficha small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

.ficha strong{
  font-size:16px;
}

footer{
  border-top:1px solid #222;
  padding:30px 7%;
  text-align:center;
  color:#666;
}

@media(max-width:750px){
  nav{
    display:none;
  }

  .hero{
    min-height:330px;
    padding-top:70px;
  }

  .detalle-grid{
    grid-template-columns:1fr;
  }

  .detalle h2{
    font-size:36px;
  }

  .detalle-imagen{
    min-height:280px;
  }
}
</style>

</section>

<footer>

/* =====================================================
   ESTADO
===================================================== */

let marcaActual = "Todas";
let indiceImagen = 0;


/* =====================================================
   CARGADOR DE IMÁGENES CON RESPALDO
===================================================== */

function cargarConRespaldo(img, urls, fallback){

  let indice = 0;

  function intentar(){

    if(indice >= urls.length){

      img.style.display = "none";

      if(fallback){
        fallback.style.display = "block";
      }

      return;
    }

    const url = urls[indice++];

    img.onload = function(){
      img.style.display = "block";

      if(fallback){
        fallback.style.display = "none";
      }
    };

    img.onerror = function(){
      intentar();
    };

    img.src = url;
  }

  intentar();
}


/* =====================================================
   MOSTRAR CATÁLOGO
===================================================== */

function mostrarMotos(){

  const grid = document.getElementById("grid");
  const texto = document.getElementById("buscador").value
    .toLowerCase()
    .trim();

  grid.innerHTML = "";

  const filtradas = motos.filter(moto => {

    const coincideMarca =
      marcaActual === "Todas" ||
      moto.marca === marcaActual;

    const coincideBusqueda =
      moto.nombre.toLowerCase().includes(texto) ||
      moto.marca.toLowerCase().includes(texto) ||
      moto.tipo.toLowerCase().includes(texto);

    return coincideMarca && coincideBusqueda;
  });


  filtradas.forEach((moto) => {

    const indiceReal = motos.indexOf(moto);

    const card = document.createElement("article");
    card.className = "card";

    card.innerHTML = `
      <div class="imagen-box">
        <img class="card-img" alt="${moto.nombre}">
        <div class="imagen-fallback">
          🏍️<br><br>
          Imagen no disponible
        </div>
      </div>

      <div class="card-info">

        <div class="marca">${moto.marca}</div>

        <h3>${moto.nombre}</h3>

        <div class="specs">
          <span>${moto.cc}</span>
          <span>${moto.hp}</span>
          <span>${moto.nm}</span>
        </div>

      </div>
    `;

    card.addEventListener("click", function(){
      abrirDetalle(indiceReal);
    });

    grid.appendChild(card);

    const img = card.querySelector(".card-img");
    const fallback = card.querySelector(".imagen-fallback");

    cargarConRespaldo(img, moto.imagenes, fallback);
  });
}


/* =====================================================
   FILTROS
===================================================== */

document.querySelectorAll(".filtro").forEach(boton => {

  boton.addEventListener("click", function(){

    document.querySelectorAll(".filtro")
      .forEach(b => b.classList.remove("activo"));

    this.classList.add("activo");

    marcaActual = this.dataset.marca;

    mostrarMotos();
  });

});


/* =====================================================
   BUSCADOR
===================================================== */

document
  .getElementById("buscador")
  .addEventListener("input", mostrarMotos);


/* =====================================================
   ABRIR DETALLE
===================================================== */

function abrirDetalle(indice){

  const moto = motos[indice];

  document.querySelector(".hero").style.display = "none";
  document.querySelector(".controles").style.display = "none";
  document.querySelector(".catalogo").style.display = "none";
  document.querySelector(".detalle").style.display = "block";

  document.getElementById("detalleMarca").textContent = moto.marca;
  document.getElementById("detalleNombre").textContent = moto.nombre;
  document.getElementById("detalleDescripcion").textContent = moto.descripcion;

  document.getElementById("detalleCc").textContent = moto.cc;
  document.getElementById("detalleHp").textContent = moto.hp;
  document.getElementById("detalleNm").textContent = moto.nm;
  document.getElementById("detalleTipo").textContent = moto.tipo;

  const img = document.getElementById("detalleImg");
  const fallback = document.getElementById("detalleFallback");

  img.style.display = "block";
  fallback.style.display = "none";

  cargarConRespaldo(img, moto.imagenes, fallback);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =====================================================
   VOLVER
===================================================== */

function volverCatalogo(){

  document.querySelector(".detalle").style.display = "none";
  document.querySelector(".hero").style.display = "flex";
  document.querySelector(".controles").style.display = "block";
  document.querySelector(".catalogo").style.display = "block";

  window.location.hash = "catalogo";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

mostrarMotos();
